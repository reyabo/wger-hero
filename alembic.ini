# Alembic configuration for wger-hero.
#
# Migrations are an explicit deployment step: nothing here runs on import or at
# application startup. See docs/DEPLOY.md.
#
# The database URL is NOT stored here — migrations/env.py reads it from the
# application settings (DATABASE_URL), so there is no second source of truth
# and no credentials in the repository.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
