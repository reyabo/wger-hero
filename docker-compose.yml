services:
  wger-hero:
    build: .
    container_name: wger-hero
    restart: unless-stopped
    ports:
      - "8091:5000"
    volumes:
      - /srv/data/wger-hero:/data
      - ./secrets/wger_api_token.txt:/run/secrets/wger_api_token:ro
      # Access protection. AUTH_ENABLED defaults to true, and the app reads
      # both files on every request — without them it answers 503 on every
      # path, including /healthz. See README "Set up access protection".
      - ./secrets/hero_password_hash:/run/secrets/hero_password_hash:ro
      - ./secrets/hero_session_secret:/run/secrets/hero_session_secret:ro
      # FitTrackee OAuth. The client secret is read-only; the token store is
      # the one writable mount, in a directory of its own so a token refresh
      # can never overwrite the secret. Both are optional — without
      # FITTRACKEE_BASE_URL the integration is simply off.
      - ./secrets/fittrackee/client_secret:/run/secrets/fittrackee_client_secret:ro
      - ./secrets/fittrackee-oauth:/run/wger-hero-fittrackee:rw
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/wger_hero.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
