<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}wger-hero{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#070a13">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon.svg">
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>
  <header class="site-header">
    <div class="container">
      <a href="/" class="site-logo">⚔ wger-hero</a>
      <nav aria-label="Hauptnavigation">
        <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Übersicht</a>
        <a href="/today" {% if request.url.path.startswith('/today') %}class="active"{% endif %}>Heute</a>
        <a href="/week" {% if request.url.path.startswith('/week') %}class="active"{% endif %}>Woche</a>
        <a href="/goals" {% if request.url.path.startswith('/goals') %}class="active"{% endif %}>Ziele</a>
        <a href="/habits" {% if request.url.path.startswith('/habits') %}class="active"{% endif %}>Habits</a>
        <a href="/quests" {% if request.url.path.startswith('/quests') %}class="active"{% endif %}>Quests</a>
        <a href="/achievements" {% if request.url.path.startswith('/achievements') %}class="active"{% endif %}>Achievements</a>
        <a href="/stats" {% if request.url.path.startswith('/stats') %}class="active"{% endif %}>Attribute</a>
        <a href="/japanese" {% if request.url.path.startswith('/japanese') %}class="active"{% endif %}>Japanisch</a>
        <a href="/settings" {% if request.url.path.startswith('/settings') %}class="active"{% endif %}>Einstellungen</a>
      </nav>
    </div>
  </header>

  <main class="container" id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>wger-hero &mdash; selbst gehosteter Trainingsbegleiter</span>
    </div>
  </footer>
  <script>
    // Defensive and non-blocking: an unsupported or failing registration must
    // never affect the page, and nothing about the failure is logged — console
    // output from an authenticated page could carry more than intended.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(function () {});
      });
    }
  </script>
</body>
</html>
